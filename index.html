<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>小鎮冒險 - AI 對話遊戲</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>小鎮冒險：AI 對話遊戲</h1>
    
    <div id="intro-section">
      <label for="player-name">請輸入主角名字：</label>
      <input type="text" id="player-name" placeholder="例如：名語">
      <button id="start-game">開始遊戲</button>
    </div>

    <div id="game-section" style="display: none;">
      <div id="chat-log" class="chat-log"></div>

      <textarea id="user-input" placeholder="你想做什麼？"></textarea>
      <button id="send-btn">送出</button>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
